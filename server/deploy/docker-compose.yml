# The official instance's stack, kept at /opt/perixd on Zakros.
services:
  server:
    image: ghcr.io/aallynreed/perixd-server:latest
    container_name: perixd
    restart: unless-stopped
    ports:
      - "10.8.0.253:8480:8080"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.96.0/20
